name: career_copilot
description: "AI-powered internship and job application manager for college students."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  intl: ^0.19.0
  uuid: ^4.4.0
  google_generative_ai: ^0.4.0
  receive_sharing_intent: ^1.4.5
  table_calendar: ^3.1.2
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.2
  flutter_staggered_animations: ^1.1.1
  smooth_page_indicator: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
