  <script>
    function checkAndroidPopup() {
      if (!sessionStorage.getItem('dismissed_android_popup')) {
        var el = document.getElementById('android-app-popup');
        if (el) el.style.display = 'block';
      }
    }
    function dismissAndroidPopup() {
      var el = document.getElementById('android-app-popup');
      if (el) el.style.display = 'none';
      sessionStorage.setItem('dismissed_android_popup', 'true');
    }
    setTimeout(checkAndroidPopup, 600);

    // Ensure clean state: unregister service workers, clear CacheStorage & purge legacy flags
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(keys) {
        for (var i = 0; i < keys.length; i++) {
          caches.delete(keys[i]);
        }
      });
    }
    try {
      var customKey = localStorage.getItem('flutter.gemini_api_key');
      if (!customKey || customKey === '""' || customKey === '\"\"') {
        localStorage.removeItem('flutter.gemini_key_cleared_by_user');
        localStorage.removeItem('flutter.gemini_api_key');
      }
    } catch (e) {}
